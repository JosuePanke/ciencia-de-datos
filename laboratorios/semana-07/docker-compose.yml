name: lab1-nyc-taxi

services:

  kestra-db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${KESTRA_USER}
      - POSTGRES_PASSWORD=${KESTRA_PASSWORD}
      - POSTGRES_DB=${KESTRA_DB}
    volumes:
      - kestra-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KESTRA_USER} -d ${KESTRA_DB}"]
      interval: 5s
      retries: 10

  kestra:
    image: kestra/kestra:v1.3.37
    user: "root"
    command: ["server", "standalone"]
    ports:
      - "8080:8080"

    environment:
      # Credenciales de Snowflake -> en los flows: {{ envs.snowflake_account }}, etc.
      ENV_SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      ENV_SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      ENV_SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      ENV_SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
      ENV_SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      ENV_SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}

      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-db:5432/${KESTRA_DB}
            driverClassName: org.postgresql.Driver
            username: ${KESTRA_USER}
            password: ${KESTRA_PASSWORD}

        kestra:
          server:
            basic-auth:
              enabled: false
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080

    volumes:
      - kestra-storage:/app/storage
      - ./kestra/flows:/app/flows

    depends_on:
      kestra-db:
        condition: service_healthy
  
  dbt:
    build: ./infra/dbt
    env_file: .env
    volumes:
      - ./dbt:/usr/app/dbt
    profiles: ["tools"]



volumes:
  kestra-db-data:
  kestra-storage:
