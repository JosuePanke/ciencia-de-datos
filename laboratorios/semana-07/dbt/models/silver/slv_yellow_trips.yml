version: 2

models:
  - name: slv_yellow_trips
    description: >
      Viajes de NYC Yellow Taxi limpios y estandarizados. Un registro por viaje válido.
      Se conservan los viajes Flex Fare (payment_type_id = 0) aunque no traigan pasajeros ni rate code.
    columns:
      - name: trip_id
        description: Identificador del viaje (hash de vendor, fechas, zonas, distancia y total).
        data_tests:
          - unique
          - not_null
      - name: pickup_datetime
        data_tests:
          - not_null
      - name: dropoff_datetime
        data_tests:
          - not_null
      - name: vendor_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 6, 7]
                quote: false
      - name: rate_code_id
        description: Tarifa aplicada. NULL en Bronze pasa a 99 (Unknown).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 99]
                quote: false
      - name: payment_type_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6]
                quote: false
      - name: passenger_count
        description: Entre 1 y 6. NULL si no se reportó o era inválido (0 o más de 6).
      - name: pickup_location_id
        data_tests:
          - not_null
      - name: dropoff_location_id
        data_tests:
          - not_null
      - name: total_amount
        data_tests:
          - not_null
